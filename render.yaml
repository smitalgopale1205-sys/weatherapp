services:
  - type: web
    name: weather-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    # Deploys are triggered only by Jenkins (after tests pass) via the deploy hook.
    # Auto-deploy is off so a push never deploys twice or bypasses the pipeline.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
